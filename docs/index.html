<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Commands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--panel2:#f0f2f5;--text:#1b1f24;--muted:#5b6470;--line:#e2e5ea;
  --accent:#16a34a;--accent2:#0ea5e9;--accent3:#a855f7;--code:#0f172a;--codetext:#e2e8f0;--hl:#fde68a;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f14;--panel:#111821;--panel2:#16202b;--text:#e6edf3;--muted:#8b98a7;--line:#1f2b38;
    --accent:#3fdc7c;--accent2:#38bdf8;--accent3:#c084fc;--code:#070b10;--codetext:#d7e3ee;--hl:#5b4a12;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f14;--panel:#111821;--panel2:#16202b;--text:#e6edf3;--muted:#8b98a7;--line:#1f2b38;
  --accent:#3fdc7c;--accent2:#38bdf8;--accent3:#c084fc;--code:#070b10;--codetext:#d7e3ee;--hl:#5b4a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}
code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:inherit}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;white-space:nowrap}
.brand .prompt{font-family:"JetBrains Mono",monospace;color:var(--accent)}
.brand .cursor{display:inline-block;width:9px;height:18px;background:var(--accent);vertical-align:-3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 44px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px "JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--panel2)}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:17px}
.chips{max-width:1280px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font:500 13px Inter,sans-serif}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#04120a}
.count{margin-left:auto;color:var(--muted);font-size:13px}

.layout{max-width:1280px;margin:0 auto;padding:20px 16px 80px;display:grid;grid-template-columns:260px 1fr;gap:28px}
nav.toc{position:sticky;top:140px;align-self:start;max-height:calc(100vh - 160px);overflow:auto;padding-right:6px}
.toc h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.toc a{display:block;text-decoration:none;color:var(--muted);font-size:13.5px;padding:4px 10px;border-left:2px solid var(--line)}
.toc a:hover,.toc a.active{color:var(--text);border-color:var(--accent)}
.toc a.hidden{display:none}

.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 28px "JetBrains Mono",monospace}
.stat span{color:var(--muted);font-size:13px}
.stat:nth-child(1) b{color:var(--accent)}.stat:nth-child(2) b{color:var(--accent2)}.stat:nth-child(3) b{color:var(--accent3)}

.secthead{display:flex;align-items:baseline;gap:12px;margin:34px 0 4px}
.secthead h2{margin:0;font-size:26px}
.sectdesc{color:var(--muted);margin:0 0 14px}
.tema{margin:22px 0 30px}
.tema h3{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.tema h3::before{content:"#";font-family:"JetBrains Mono",monospace;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card .name{font:700 17px "JetBrains Mono",monospace;color:var(--accent);word-break:break-word}
.card.usage .name{color:var(--accent2)}
.card .desc{margin:0;color:var(--text)}
.ex{position:relative;background:var(--code);color:var(--codetext);border-radius:10px;padding:10px 40px 10px 12px;font:13px/1.5 "JetBrains Mono",monospace;overflow-x:auto;white-space:pre}
.ex::before{content:"$ ";color:#3fdc7c}
.copy{position:absolute;top:6px;right:6px;border:0;background:rgba(255,255,255,.08);color:#cbd5e1;border-radius:7px;width:28px;height:26px;cursor:pointer;font-size:13px}
.copy:hover{background:rgba(255,255,255,.18)}
.copy.ok{color:#3fdc7c}
.params{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.params .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.param{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.param code.flag{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px;color:var(--accent3);white-space:pre-wrap;word-break:break-all;max-width:170px}
.param p{margin:0;font-size:13.5px;color:var(--muted)}
.param .ex{grid-column:1/-1;font-size:12.5px;padding:7px 38px 7px 10px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:60px 0;display:none}
.totop{position:fixed;right:18px;bottom:18px;border-radius:999px;width:44px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;box-shadow:var(--shadow);font-size:18px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 0 0}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.toc{display:none}
  .hero{grid-template-columns:repeat(3,1fr)}
  .stat b{font-size:22px}
  .grid{grid-template-columns:1fr}
  .search kbd{display:none}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="prompt">~$</span> linux-commands<span class="cursor"></span></div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Busca un comando, parámetro o descripción…" autocomplete="off" aria-label="Buscar">
      <kbd>/</kbd>

    <button class="iconbtn" id="theme" title="Cambiar tema" aria-label="Cambiar tema">◐</button>

  <div class="chips" id="chips"></div>
</header>

<div class="layout">
  <nav class="toc" id="toc"></nav>
  <main>
    <div class="hero" id="hero"></div>
    <div id="content"></div>
    <div class="empty" id="empty">😶 Nada coincide con tu búsqueda.</div>
    <footer>Generado desde la hoja <i>Comandos de Linux</i> · <span class="mono">python3 scripts/build.py</span></footer>

</div>

s [1-2]", "Comando": "cat", "Parámetro": "./-", "Descripción": "Lee el archivo \"-\" indicando que está en el directorio actual, evitando la confusión con stdin", "Ejemplo": "cat ./-"}, {"Sección": "Labs", "Tema": "Lectura de archivos especiales [1-2]", "Comando": "cat", "Parámetro": "$(pwd)/-", "Descripción": "Combina pwd (ruta actual) con el nombre del archivo; mismo efecto que la ruta absoluta", "Ejemplo": "cat $(pwd)/-"}, {"Sección": "Labs", "Tema": "Lectura de archivos especiales [1-2]", "Comando": "grep", "Parámetro": "-r \"\\w\"", "Descripción": "Busca recursivamente líneas con al menos un carácter alfanumérico para encontrar contenido en archivos de cualquier carpeta", "Ejemplo": "grep -r \"\\w\" /home/usuario/"}, {"Sección": "Labs", "Tema": "Lectura de archivos especiales [1-2]", "Comando": "cut", "Parámetro": "-d ':' -f 2", "Descripción": "Divide cada línea usando \":\" como delimitador y extrae solo el segundo campo", "Ejemplo": "echo \"a:b:c\" | cut -d ':' -f 2"}, {"Sección": "Labs", "Tema": "Lectura de archivos especiales [1-2]", "Comando": "tr", "Parámetro": "':' ' '", "Descripción": "Reemplaza cada \":\" por un espacio en el texto procesado", "Ejemplo": "echo \"a:b:c\" | tr ':' ' '"}, {"Sección": "Labs", "Tema": "Lectura de archivos especiales [1-2]", "Comando": "awk", "Parámetro": "'{print $2}' FS=\":\"", "Descripción": "Usa \":\" como separador de campo (FS) e imprime la segunda columna de cada línea", "Ejemplo": "echo \"a:b:c\" | awk '{print $2}' FS=\":\""}, {"Sección": "Labs", "Tema": "Lectura de archivos especiales [1-2]", "Comando": "awk", "Parámetro": "'NF{print $NF}'", "Descripción": "Imprime el último campo de cada línea; NF es el número de campos y $NF el valor del último", "Ejemplo": "echo \"uno dos tres\" | awk 'NF{print $NF}'"}, {"Sección": "Labs", "Tema": "Lectura de archivos especiales [1-2]", "Comando": "tail", "Parámetro": "-n 1", "Descripción": "Muestra únicamente la última línea del archivo o texto procesado", "Ejemplo": "tail -n 1 saje", "Ejemplo": "git log"}, {"Sección": "Labs", "Tema": "Operando con proyectos de Github [2-5]", "Comando": "git show", "Descripción": "Muestra las propiedades y los cambios aplicados en un commit concreto", "Ejemplo": "git show a1b2c3d"}], "parametros": [{"Sección": "Labs", "Tema": "Operando con proyectos de Github [2-5]", "Comando": "git show", "Parámetro": "(id del commit)", "Descripción": "Muestra todos los cambios que se aplicaron en ese commit", "Ejemplo": "git show a1b2c3d"}, {"Sección": "Labs", "Tema": "Operando con proyectos de Github [2-5]", "Comando": "git checkout", "Parámetro": "(id del commit)", "Descripción": "Regresa el proyecto a ese punto de la historia, restaurando los archivos que existían entonces", "Ejemplo": "git checkout a1b2c3d"}]}, {"section": "Labs", "tema": "Operando con proyectos de Github [3-5]", "id": "labs-operando-con-proyectos-de-github-3-5", "comandos": [{"Sección": "Labs", "Tema": "Operando con proyectos de Github [3-5]", "Comando": "git branch", "Descripción": "Crea, lista, elimina y renombra ramas; no sirve para cambiar de rama ni para unirlas", "Ejemplo": "git branch"}, {"Sección": "Labs", "Tema": "Operando con proyectos de Github [3-5]", "Comando": "git checkout", "Descripción": "Cambia a otra rama o regresa el proyecto al estado de un commit anterior", "Ejemplo": "git checkout main"}], "parametros": [{"Sección": "Labs", "Tema": "Operando con proyectos de Github [3-5]", "Comando": "git branch", "Parámetro": "-a", "Descripción": "Lista todas las ramas del proyecto, tanto locales como remotas", "Ejemplo": "git branch -a"}, {"Sección": "Labs", "Tema": "Operando con proyectos de Github [3-5]", "Comando": "git checkout", "Parámetro": "(nombre de la rama)", "Descripción": "Cambia a la rama indicada por su nombre", "Ejemplo": "git checkout develop"}]}, {"section": "Labs", "tema": "Operando con proyectos de Github [4-5]", "id": "labs-operando-con-proyectos-de-github-4-5", "comandos": [{"Sección": "Labs", "Tema": "Operando con proye const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

// Theme
(function(){
  let t = null; try { t = localStorage.getItem("theme"); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch(e){}
  };
})();

// Build cards: one per command in a tema, with that command's params nested.
function buildCards(t){
  const cards = [];
  const byCmd = new Map();
  t.comandos.forEach(c => { const card = {name:c["Comando"], desc:c["Descripción"], ex:c["Ejemplo"], params:[], usage:false}; cards.push(card); if(!byCmd.has(card.name)) byCmd.set(card.name, card); });
  t.parametros.forEach(p => {
    let card = byCmd.get(p["Comando"]);
    if (!card){ card = {name:p["Comando"], desc:"", ex:"", params:[], usage:true}; cards.push(card); byCmd.set(card.name, card); }
    card.params.push({flag:p["Parámetro"], desc:p["Descripción"], ex:p["Ejemplo"]});
  });
  cards.forEach(c => c.text = norm([c.name,c.desc,c.ex,...c.params.flatMap(p=>[p.flag,p.desc,p.ex])].join(" ")));
  return cards;
}

const exBlock = (ex) => ex ? `<div class="ex"><span class="t">${esc(ex)}</span><button class="copy" title="Copiar" aria-label="Copiar">⧉</button></div>` : "";

function cardHTML(c){
  const params = c.params.length ? `<div class="params"><div class="lbl">${c.usage ? "Usos" : "Parámetros"}</div>${
    c.params.map(p=>`<div class="param"><code class="flag">${esc(p.flag)}</code><p>${esc(p.desc)}</p>${exBlock(p.ex)}</div>`).join("")}</div>` : "";
  return `<article class="card${c.usage?" usage":""}"><div class="name">${esc(c.name)}</div>${c.desc?`<p class="desc">${esc(c.desc)}</p>`:""}${exBlock(c.ex)}${params}</article>`;
}

// Render
const temas = DATA.temas.map(t => ({...t, cards: buildCards(t)}));
$("#hero").innerHTML = `
  <div class="stat"><b>${DATA.stats.comandos}</b><span>comandos</span></div>
  <div class="stat"><b>${DATA.stats.parametros}</b><span>parámetros</span></div>
  <div class="stat"><b>${temas.length}</b><span>temas</span></div>`;

let html = "", toc = "";
DATA.sections.forEach(s => {
  const ts = temas.filter(t => t.section === s.name);
  html += `<section class="sect" data-section="${esc(s.name)}"><div class="secthead"><h2>${s.emoji} ${esc(s.name)}</h2></div><p class="sectdesc">${esc(s.desc)}</p>`;
  toc += `<h4 data-section="${esc(s.name)}">${s.emoji} ${esc(s.name)}</h4>`;
  ts.forEach(t => {
    html += `<div class="tema" id="${t.id}" data-section="${esc(s.name)}"><h3>${esc(t.tema)}</h3><div class="grid">${t.cards.map(cardHTML).join("")}</div></div>`;
    toc += `<a href="#${t.id}" data-id="${t.id}" data-section="${esc(s.name)}">${esc(t.tema)}</a>`;
  });
  html += `</section>`;
});
$("#content").innerHTML = html;
$("#toc").innerHTML = toc;

// Attach card elements to model
document.querySelectorAll(".tema").forEach((el, i) => {
  const cardEls = el.querySelectorAll(".card");
  temas[i].el = el;
  temas[i].cards.forEach((c, j) => { c.el = cardEls[j]; c.orig = cardEls[j].innerHTML; });
});

// Section chips
const active = new Set();
$("#chips").innerHTML = DATA.sections.map(s => `<button class="chip" aria-pressed="false" data-s="${esc(s.name)}">${s.emoji} ${esc(s.name)}</button>`).join("") + `<span class="count" id="count"></span>`;
document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
  const s = b.dataset.s; active.has(s) ? active.delete(s) : active.add(s);
  b.setAttribute("aria-pressed", active.has(s)); apply();
});

function highlight(el, terms){
  if (!terms.length) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    if (n.parentElement.closest("button")) return;
    const txt = n.nodeValue, low = norm(txt);
    const ranges = [];
    terms.forEach(t => { let i = 0; while ((i = low.indexOf(t, i)) !== -1){ ranges.push([i, i + t.length]); i += t.length; } });
    if (!ranges.length) return;
    ranges.sort((a,b)=>a[0]-b[0]);
    const frag = document.createDocumentFragment(); let pos = 0;
    ranges.forEach(([a,b]) => { if (a < pos) return; frag.append(txt.slice(pos,a)); const m = document.createElement("mark"); m.textContent = txt.slice(a,b); frag.append(m); pos = b; });
    frag.append(txt.slice(pos)); n.replaceWith(frag);
  });
}

function apply(){
  const terms = norm($("#q").value).split(/\s+/).filter(Boolean);
  let shown = 0;
  temas.forEach(t => {
    const secOk = !active.size || active.has(t.section);
    let any = false;
    t.cards.forEach(c => {
      const ok = secOk && terms.every(term => c.text.includes(term));
      c.el.style.display = ok ? "" : "none";
      c.el.innerHTML = c.orig;
      if (ok){ any = true; shown++; highlight(c.el, terms); }
    });
    t.el.style.display = any ? "" : "none";
    const link = document.querySelector(`.toc a[data-id="${t.id}"]`);
    link.classList.toggle("hidden", !any);
  });
  document.querySelectorAll(".sect").forEach(s => s.style.display = [...s.querySelectorAll(".tema")].some(t => t.style.display !== "none") ? "" : "none");
  document.querySelectorAll(".toc h4").forEach(h => h.style.display = document.querySelector(`.toc a[data-section="${h.dataset.section}"]:not(.hidden)`) ? "" : "none");
  $("#empty").style.display = shown ? "none" : "block";
  $("#count").textContent = `${shown} tarjeta${shown === 1 ? "" : "s"}`;
}
$("#q").addEventListener("input", apply);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")){ $("#q").value = ""; apply(); }
});

// Copy buttons
document.addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const text = b.parentElement.querySelector(".t").textContent;
  try { await navigator.clipboard.writeText(text); } catch(err){
    const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove();
  }
  b.textContent = "✓"; b.classList.add("ok"); setTimeout(() => { b.textContent = "⧉"; b.classList.remove("ok"); }, 1200);
});

// Active TOC link on scroll
const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting){
    document.querySelectorAll(".toc a.active").forEach(a => a.classList.remove("active"));
    const a = document.querySelector(`.toc a[data-id="${en.target.id}"]`); if (a) a.classList.add("active");
  }});
}, {rootMargin: "-160px 0px -70% 0px"});
temas.forEach(t => io.observe(t.el));

apply();
</script>
